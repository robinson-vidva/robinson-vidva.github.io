name: Update Page View Counts

on:
  schedule:
    # Runs daily at 6:00 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-analytics-data

      - name: Write service account key
        run: echo '${{ secrets.GA_SERVICE_ACCOUNT_KEY }}' > /tmp/ga-key.json

      - name: Fetch GA4 page views
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/ga-key.json
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: python scripts/fetch_ga_views.py

      - name: Clean up key
        if: always()
        run: rm -f /tmp/ga-key.json

      - name: Commit and push updated views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add views.json
          git diff --staged --quiet || git commit -m "Update page view counts [automated]"
          git push
